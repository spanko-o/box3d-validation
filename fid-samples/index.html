<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FID 14.87</title>
  <style>
    :root{--ink:#eef4f2;--muted:#9fb1ad;--line:rgba(238,244,242,.14);--accent:#69e3bd;--gold:#f4bd76}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at 50% -10%,#1c3535 0,#0b1113 48%);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{max-width:1500px;margin:0 auto;padding:42px 34px 64px}
    .hero{margin-bottom:28px;padding-bottom:26px;border-bottom:1px solid var(--line)}
    .eyebrow{margin:0 0 8px;color:var(--muted);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(50px,8vw,106px);line-height:.9;letter-spacing:-.07em;font-weight:700;color:var(--accent)}
    .analysis{grid-column:1/-1;padding:18px 21px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.045);color:#cdd9d6}
    .analysis strong{display:block;margin-bottom:5px;font-size:14px;color:var(--accent)}
    .analysis.high strong{color:var(--gold)}
    .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-bottom:20px}
    article{min-width:0;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.18)}
    .meta{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 17px 13px}
    .sample{font-weight:650;letter-spacing:.02em}.distance{font-variant-numeric:tabular-nums;font-weight:700}
    .low .distance{color:var(--accent)}.high .distance{color:var(--gold)}
    video{display:block;width:100%;aspect-ratio:832/480;object-fit:cover;background:#050708}
    .caption{padding:11px 17px 15px;color:var(--muted);font-size:12px}
    @media(max-width:900px){.row{grid-template-columns:1fr}.analysis{grid-column:auto}}
  </style>
</head>
<body>
  <main>
    <header class="hero"><p class="eyebrow">FID</p><h1>14.87</h1></header>

    <section class="row low">
      <div class="analysis"><strong>较低值样本</strong>通常场景较静止，背景和视角变化较小，因此原视频与生成视频在前段更接近。</div>
      <article><div class="meta"><span class="sample">Sample 251</span><span class="distance">3.73</span></div><video controls playsinline preload="metadata" poster="posters/sample-251.jpg" src="videos/sample-251.mp4"></video><div class="caption">Sample 251</div></article>
      <article><div class="meta"><span class="sample">Sample 437</span><span class="distance">3.97</span></div><video controls playsinline preload="metadata" poster="posters/sample-437.jpg" src="videos/sample-437.mp4"></video><div class="caption">Sample 437</div></article>
      <article><div class="meta"><span class="sample">Sample 433</span><span class="distance">4.36</span></div><video controls playsinline preload="metadata" poster="posters/sample-433.jpg" src="videos/sample-433.mp4"></video><div class="caption">Sample 433</div></article>
    </section>

    <section class="row high">
      <div class="analysis high"><strong>较高值样本</strong>通常包含车辆运动、视角变化或较大的背景变化，时间上的结构变化会使原视频与生成视频的特征差异增大。</div>
      <article><div class="meta"><span class="sample">Sample 428</span><span class="distance">27.76</span></div><video controls playsinline preload="metadata" poster="posters/sample-428.jpg" src="videos/sample-428.mp4"></video><div class="caption">Sample 428</div></article>
      <article><div class="meta"><span class="sample">Sample 33</span><span class="distance">27.96</span></div><video controls playsinline preload="metadata" poster="posters/sample-33.jpg" src="videos/sample-33.mp4"></video><div class="caption">Sample 33</div></article>
      <article><div class="meta"><span class="sample">Sample 26</span><span class="distance">28.23</span></div><video controls playsinline preload="metadata" poster="posters/sample-26.jpg" src="videos/sample-26.mp4"></video><div class="caption">Sample 26</div></article>
    </section>
  </main>
</body>
</html>
