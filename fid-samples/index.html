<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FID 14.87</title>
  <style>
    :root{--ink:#eef4f2;--muted:#9fb1ad;--line:rgba(238,244,242,.14);--accent:#69e3bd;--gold:#f4bd76}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at 50% -10%,#1c3535 0,#0b1113 48%);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{max-width:1500px;margin:0 auto;padding:42px 34px 64px}
    .hero{margin-bottom:28px;padding-bottom:26px;border-bottom:1px solid var(--line)}
    .eyebrow{margin:0 0 8px;color:var(--muted);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(50px,8vw,106px);line-height:.9;letter-spacing:-.07em;font-weight:700;color:var(--accent)}
    .group{margin-bottom:28px}
    .group-heading{margin-bottom:14px;padding:15px 20px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.045);color:#cdd9d6;font-size:14px}
    .group-heading strong{display:block;margin-bottom:4px;font-weight:650}
    .group-heading span{color:var(--muted);font-weight:400}
    .group.high .group-heading{color:var(--gold)}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
    article{min-width:0;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.18)}
    .meta{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 17px 13px}
    .sample{font-weight:650;letter-spacing:.02em}.distance{font-variant-numeric:tabular-nums;font-weight:700}
    .low .distance{color:var(--accent)}.high .distance{color:var(--gold)}
    .pair{display:grid;gap:12px;padding:0 12px 14px}
    .video-block{display:grid;gap:6px}
    .video-label{color:var(--muted);font-size:12px}
    video{display:block;width:100%;aspect-ratio:832/480;object-fit:cover;background:#050708;border-radius:10px}
    @media(max-width:900px){main{padding-left:18px;padding-right:18px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <header class="hero"><p class="eyebrow">FID</p><h1>14.87</h1></header>

    <section class="group low">
      <div class="group-heading"><strong>较低值样本</strong><span>画面变化较小，整体布局相对稳定。</span></div>
      <div class="grid">
        <article><div class="meta"><span class="sample">Sample 251</span><span class="distance">3.73</span></div><div class="pair"><div class="video-block"><span class="video-label">原视频</span><video class="real" controls playsinline preload="metadata" poster="posters/sample-251-real.jpg" src="videos/sample-251-real.mp4"></video></div><div class="video-block"><span class="video-label">生成视频</span><video class="gen" controls playsinline muted preload="metadata" poster="posters/sample-251.jpg" src="videos/sample-251.mp4"></video></div></div></article>
        <article><div class="meta"><span class="sample">Sample 437</span><span class="distance">3.97</span></div><div class="pair"><div class="video-block"><span class="video-label">原视频</span><video class="real" controls playsinline preload="metadata" poster="posters/sample-437-real.jpg" src="videos/sample-437-real.mp4"></video></div><div class="video-block"><span class="video-label">生成视频</span><video class="gen" controls playsinline muted preload="metadata" poster="posters/sample-437.jpg" src="videos/sample-437.mp4"></video></div></div></article>
        <article><div class="meta"><span class="sample">Sample 433</span><span class="distance">4.36</span></div><div class="pair"><div class="video-block"><span class="video-label">原视频</span><video class="real" controls playsinline preload="metadata" poster="posters/sample-433-real.jpg" src="videos/sample-433-real.mp4"></video></div><div class="video-block"><span class="video-label">生成视频</span><video class="gen" controls playsinline muted preload="metadata" poster="posters/sample-433.jpg" src="videos/sample-433.mp4"></video></div></div></article>
      </div>
    </section>

    <section class="group high">
      <div class="group-heading"><strong>较高值样本</strong><span>通常包含车辆运动、视角变化或较大的背景变化。</span></div>
      <div class="grid">
        <article><div class="meta"><span class="sample">Sample 428</span><span class="distance">27.76</span></div><div class="pair"><div class="video-block"><span class="video-label">原视频</span><video class="real" controls playsinline preload="metadata" poster="posters/sample-428-real.jpg" src="videos/sample-428-real.mp4"></video></div><div class="video-block"><span class="video-label">生成视频</span><video class="gen" controls playsinline muted preload="metadata" poster="posters/sample-428.jpg" src="videos/sample-428.mp4"></video></div></div></article>
        <article><div class="meta"><span class="sample">Sample 33</span><span class="distance">27.96</span></div><div class="pair"><div class="video-block"><span class="video-label">原视频</span><video class="real" controls playsinline preload="metadata" poster="posters/sample-33-real.jpg" src="videos/sample-33-real.mp4"></video></div><div class="video-block"><span class="video-label">生成视频</span><video class="gen" controls playsinline muted preload="metadata" poster="posters/sample-33.jpg" src="videos/sample-33.mp4"></video></div></div></article>
        <article><div class="meta"><span class="sample">Sample 26</span><span class="distance">28.23</span></div><div class="pair"><div class="video-block"><span class="video-label">原视频</span><video class="real" controls playsinline preload="metadata" poster="posters/sample-26-real.jpg" src="videos/sample-26-real.mp4"></video></div><div class="video-block"><span class="video-label">生成视频</span><video class="gen" controls playsinline muted preload="metadata" poster="posters/sample-26.jpg" src="videos/sample-26.mp4"></video></div></div></article>
      </div>
    </section>
  </main>
  <script>
    document.querySelectorAll('article').forEach(card=>{
      const videos=[...card.querySelectorAll('video')];
      let syncing=false;
      const sync=(source,action)=>{
        if(syncing)return;
        const target=videos.find(video=>video!==source);
        if(!target)return;
        syncing=true;
        if(Math.abs(target.currentTime-source.currentTime)>.08)target.currentTime=source.currentTime;
        if(action==='play'){const promise=target.play();if(promise?.catch)promise.catch(()=>{})}
        if(action==='pause')target.pause();
        syncing=false;
      };
      videos.forEach(video=>{
        video.addEventListener('play',()=>sync(video,'play'));
        video.addEventListener('pause',()=>sync(video,'pause'));
        video.addEventListener('seeking',()=>sync(video,'seek'));
        video.addEventListener('timeupdate',()=>sync(video,'time'));
      });
    });
  </script>
</body>
</html>
