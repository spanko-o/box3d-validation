<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FID 14.87</title>
  <style>
    :root{--ink:#eef4f2;--muted:#9fb1ad;--line:rgba(238,244,242,.14);--accent:#69e3bd}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at 50% -10%,#1c3535 0,#0b1113 48%);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{max-width:1480px;margin:0 auto;padding:42px 34px 64px}
    .hero{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:24px;padding-bottom:26px;border-bottom:1px solid var(--line)}
    .eyebrow{margin:0 0 8px;color:var(--muted);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(50px,8vw,106px);line-height:.9;letter-spacing:-.07em;font-weight:700;color:var(--accent)}
    .notes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 30px}
    .note{padding:17px 19px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.045);color:#cdd9d6}
    .note strong{display:block;margin-bottom:5px;color:var(--accent);font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
    article{min-width:0;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.18)}
    article.low{--tag:#69e3bd} article.high{--tag:#f4bd76}
    .meta{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 17px 13px}
    .sample{font-weight:650;letter-spacing:.02em}.distance{color:var(--tag);font-variant-numeric:tabular-nums;font-weight:700}
    .comparison{position:relative;aspect-ratio:832/480;background:#050708;--split:50%}
    .comparison video{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;background:#050708}
    .generated{position:absolute;inset:0;clip-path:inset(0 0 0 var(--split));pointer-events:none}
    .divider{position:absolute;top:0;bottom:0;left:var(--split);width:2px;transform:translateX(-1px);background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.22),0 0 18px rgba(0,0,0,.5);pointer-events:none}
    .handle{position:absolute;top:50%;left:var(--split);width:36px;height:36px;transform:translate(-50%,-50%);border:2px solid #fff;border-radius:50%;background:rgba(10,17,19,.78);box-shadow:0 3px 12px rgba(0,0,0,.35);pointer-events:none}
    .handle:before,.handle:after{content:"";position:absolute;top:15px;width:8px;height:2px;background:#fff}.handle:before{left:7px}.handle:after{right:7px}
    .labels{position:absolute;top:13px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;color:#fff;font-size:12px;font-weight:650;text-shadow:0 1px 4px #000;pointer-events:none}
    .scrubber{position:absolute;top:0;left:0;right:0;bottom:48px;width:100%;margin:0;opacity:0;cursor:ew-resize;z-index:3}
    .caption{padding:12px 17px 16px;color:var(--muted);font-size:12px}
    @media(max-width:900px){.grid{grid-template-columns:1fr}.notes{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <header class="hero"><div><p class="eyebrow">FID</p><h1>14.87</h1></div></header>
    <section class="notes">
      <div class="note"><strong>较低值样本</strong>通常场景较静止，背景和视角变化较小。</div>
      <div class="note"><strong>较高值样本</strong>通常包含车辆运动、视角变化或较大的背景变化。</div>
    </section>
    <section class="grid" aria-label="samples">
      <article class="low"><div class="meta"><span class="sample">Sample 251</span><span class="distance">3.73</span></div><div class="comparison"><video class="real" controls playsinline preload="metadata" poster="posters/sample-251-real.jpg" src="videos/sample-251-real.mp4"></video><div class="generated"><video class="gen" muted playsinline preload="metadata" poster="posters/sample-251.jpg" src="videos/sample-251.mp4"></video></div><div class="labels"><span>原视频</span><span>生成视频</span></div><div class="divider"></div><div class="handle"></div><input class="scrubber" type="range" min="0" max="100" value="50" aria-label="Sample 251 分隔线"></div><div class="caption">拖动分隔线</div></article>
      <article class="low"><div class="meta"><span class="sample">Sample 437</span><span class="distance">3.97</span></div><div class="comparison"><video class="real" controls playsinline preload="metadata" poster="posters/sample-437-real.jpg" src="videos/sample-437-real.mp4"></video><div class="generated"><video class="gen" muted playsinline preload="metadata" poster="posters/sample-437.jpg" src="videos/sample-437.mp4"></video></div><div class="labels"><span>原视频</span><span>生成视频</span></div><div class="divider"></div><div class="handle"></div><input class="scrubber" type="range" min="0" max="100" value="50" aria-label="Sample 437 分隔线"></div><div class="caption">拖动分隔线</div></article>
      <article class="low"><div class="meta"><span class="sample">Sample 433</span><span class="distance">4.36</span></div><div class="comparison"><video class="real" controls playsinline preload="metadata" poster="posters/sample-433-real.jpg" src="videos/sample-433-real.mp4"></video><div class="generated"><video class="gen" muted playsinline preload="metadata" poster="posters/sample-433.jpg" src="videos/sample-433.mp4"></video></div><div class="labels"><span>原视频</span><span>生成视频</span></div><div class="divider"></div><div class="handle"></div><input class="scrubber" type="range" min="0" max="100" value="50" aria-label="Sample 433 分隔线"></div><div class="caption">拖动分隔线</div></article>
      <article class="high"><div class="meta"><span class="sample">Sample 428</span><span class="distance">27.76</span></div><div class="comparison"><video class="real" controls playsinline preload="metadata" poster="posters/sample-428-real.jpg" src="videos/sample-428-real.mp4"></video><div class="generated"><video class="gen" muted playsinline preload="metadata" poster="posters/sample-428.jpg" src="videos/sample-428.mp4"></video></div><div class="labels"><span>原视频</span><span>生成视频</span></div><div class="divider"></div><div class="handle"></div><input class="scrubber" type="range" min="0" max="100" value="50" aria-label="Sample 428 分隔线"></div><div class="caption">拖动分隔线</div></article>
      <article class="high"><div class="meta"><span class="sample">Sample 33</span><span class="distance">27.96</span></div><div class="comparison"><video class="real" controls playsinline preload="metadata" poster="posters/sample-33-real.jpg" src="videos/sample-33-real.mp4"></video><div class="generated"><video class="gen" muted playsinline preload="metadata" poster="posters/sample-33.jpg" src="videos/sample-33.mp4"></video></div><div class="labels"><span>原视频</span><span>生成视频</span></div><div class="divider"></div><div class="handle"></div><input class="scrubber" type="range" min="0" max="100" value="50" aria-label="Sample 33 分隔线"></div><div class="caption">拖动分隔线</div></article>
      <article class="high"><div class="meta"><span class="sample">Sample 26</span><span class="distance">28.23</span></div><div class="comparison"><video class="real" controls playsinline preload="metadata" poster="posters/sample-26-real.jpg" src="videos/sample-26-real.mp4"></video><div class="generated"><video class="gen" muted playsinline preload="metadata" poster="posters/sample-26.jpg" src="videos/sample-26.mp4"></video></div><div class="labels"><span>原视频</span><span>生成视频</span></div><div class="divider"></div><div class="handle"></div><input class="scrubber" type="range" min="0" max="100" value="50" aria-label="Sample 26 分隔线"></div><div class="caption">拖动分隔线</div></article>
    </section>
  </main>
  <script>
    document.querySelectorAll('.comparison').forEach(box=>{
      const real=box.querySelector('.real'), gen=box.querySelector('.gen'), range=box.querySelector('.scrubber');
      const sync=()=>{if(Math.abs(gen.currentTime-real.currentTime)>.08)gen.currentTime=real.currentTime};
      range.addEventListener('input',()=>box.style.setProperty('--split',range.value+'%'));
      real.addEventListener('play',()=>gen.play().catch(()=>{}));
      real.addEventListener('pause',()=>gen.pause());
      real.addEventListener('seeking',()=>{gen.currentTime=real.currentTime});
      real.addEventListener('timeupdate',sync);
      real.addEventListener('ratechange',()=>{gen.playbackRate=real.playbackRate});
    });
  </script>
</body>
</html>
