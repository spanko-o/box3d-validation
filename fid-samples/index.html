<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FID 14.87</title>
  <style>
    :root{--ink:#eef4f2;--muted:#9fb1ad;--line:rgba(238,244,242,.14);--accent:#69e3bd;--bg:#0b1113;--panel:#121b1e}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at 50% -10%,#1c3535 0,#0b1113 48%);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{max-width:1480px;margin:0 auto;padding:42px 34px 64px}
    .hero{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:30px;padding-bottom:26px;border-bottom:1px solid var(--line)}
    .eyebrow{margin:0 0 8px;color:var(--muted);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(50px,8vw,106px);line-height:.9;letter-spacing:-.07em;font-weight:700;color:var(--accent)}
    .unit{margin:0 0 5px;color:var(--muted);font-size:15px}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
    article{min-width:0;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.18)}
    article.low{--tag:#69e3bd} article.high{--tag:#f4bd76}
    .meta{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 17px 13px}
    .sample{font-weight:650;letter-spacing:.02em}
    .distance{color:var(--tag);font-variant-numeric:tabular-nums;font-weight:700}
    video{display:block;width:100%;aspect-ratio:832/480;background:#050708;object-fit:cover}
    .label{padding:12px 17px 16px;color:var(--muted);font-size:12px;letter-spacing:.04em}
    @media(max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:640px){main{padding:26px 14px 42px}.hero{align-items:start;flex-direction:column;gap:14px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div><p class="eyebrow">FID</p><h1>14.87</h1></div>
      <p class="unit">Inception特征距离</p>
    </header>
    <section class="grid" aria-label="samples">
      <article class="low"><div class="meta"><span class="sample">Sample 251</span><span class="distance">3.73</span></div><video controls playsinline preload="metadata" poster="posters/sample-251.jpg" src="videos/sample-251.mp4"></video><div class="label">Inception特征距离</div></article>
      <article class="low"><div class="meta"><span class="sample">Sample 437</span><span class="distance">3.97</span></div><video controls playsinline preload="metadata" poster="posters/sample-437.jpg" src="videos/sample-437.mp4"></video><div class="label">Inception特征距离</div></article>
      <article class="low"><div class="meta"><span class="sample">Sample 433</span><span class="distance">4.36</span></div><video controls playsinline preload="metadata" poster="posters/sample-433.jpg" src="videos/sample-433.mp4"></video><div class="label">Inception特征距离</div></article>
      <article class="high"><div class="meta"><span class="sample">Sample 428</span><span class="distance">27.76</span></div><video controls playsinline preload="metadata" poster="posters/sample-428.jpg" src="videos/sample-428.mp4"></video><div class="label">Inception特征距离</div></article>
      <article class="high"><div class="meta"><span class="sample">Sample 33</span><span class="distance">27.96</span></div><video controls playsinline preload="metadata" poster="posters/sample-33.jpg" src="videos/sample-33.mp4"></video><div class="label">Inception特征距离</div></article>
      <article class="high"><div class="meta"><span class="sample">Sample 26</span><span class="distance">28.23</span></div><video controls playsinline preload="metadata" poster="posters/sample-26.jpg" src="videos/sample-26.mp4"></video><div class="label">Inception特征距离</div></article>
    </section>
  </main>
</body>
</html>
