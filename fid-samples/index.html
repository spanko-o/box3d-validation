<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FID 14.87</title>
  <style>
    :root{--ink:#eef4f2;--muted:#9fb1ad;--line:rgba(238,244,242,.14);--accent:#69e3bd;--gold:#f4bd76}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at 50% -10%,#1c3535 0,#0b1113 48%);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{max-width:1500px;margin:0 auto;padding:42px 34px 64px}
    .hero{margin-bottom:28px;padding-bottom:26px;border-bottom:1px solid var(--line)}
    .eyebrow{margin:0 0 8px;color:var(--muted);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(50px,8vw,106px);line-height:.9;letter-spacing:-.07em;font-weight:700;color:var(--accent)}
    .group{margin-bottom:24px}
    .group-heading{margin-bottom:14px;padding:15px 20px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.045);color:#cdd9d6;font-size:14px;font-weight:650}
    .group.high .group-heading{color:var(--gold)}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
    article{min-width:0;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.18)}
    .comparison{position:relative;aspect-ratio:832/480;overflow:hidden;background:#050708;--split:50%;outline:none}
    .comparison video{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;background:#050708}
    .real{z-index:1}
    .generated{position:absolute;inset:0;z-index:2;clip-path:inset(0 0 0 var(--split));pointer-events:none}
    .divider{position:absolute;top:0;bottom:44px;left:var(--split);width:2px;transform:translateX(-1px);z-index:4;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.22),0 0 18px rgba(0,0,0,.5);pointer-events:none}
    .handle{position:absolute;top:50%;left:var(--split);width:36px;height:36px;transform:translate(-50%,-50%);z-index:4;border:2px solid #fff;border-radius:50%;background:rgba(10,17,19,.78);box-shadow:0 3px 12px rgba(0,0,0,.35);pointer-events:none}
    .handle:before,.handle:after{content:"";position:absolute;top:15px;width:8px;height:2px;background:#fff}.handle:before{left:7px}.handle:after{right:7px}
    .labels{position:absolute;top:13px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;color:#fff;font-size:12px;font-weight:650;text-shadow:0 1px 4px #000;z-index:4;pointer-events:none}
    .split-hit{position:absolute;top:0;left:0;right:0;bottom:44px;z-index:5;cursor:ew-resize;touch-action:none}
    .controls{position:absolute;left:0;right:0;bottom:0;height:44px;z-index:6;display:flex;align-items:center;gap:10px;padding:0 11px;background:linear-gradient(180deg,rgba(4,8,9,.2),rgba(4,8,9,.9))}
    .play{width:28px;height:28px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.9);color:#0b1113;font-size:12px;line-height:28px;cursor:pointer}
    .play:hover{background:#fff}
    .seek{width:100%;height:4px;accent-color:var(--accent);cursor:pointer}
    .comparison:focus-visible{box-shadow:0 0 0 3px var(--accent)}
    @media(max-width:900px){main{padding-left:18px;padding-right:18px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <header class="hero"><p class="eyebrow">FID</p><h1>14.87</h1></header>

    <section class="group low">
      <div class="group-heading">较低值样本</div>
      <div class="grid">
        <article><div class="comparison" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-label="拖动分隔线"><video class="real" playsinline preload="metadata" poster="posters/sample-251-real.jpg" src="videos/sample-251-real.mp4"></video><div class="generated"><video class="gen" muted playsinline preload="metadata" poster="posters/sample-251.jpg" src="videos/sample-251.mp4"></video></div><div class="labels"><span>原视频</span><span>生成视频</span></div><div class="divider"></div><div class="handle"></div><div class="split-hit"></div><div class="controls"><button class="play" type="button" aria-label="播放">▶</button><input class="seek" type="range" min="0" max="1000" value="0" aria-label="播放进度"></div></div></article>
        <article><div class="comparison" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-label="拖动分隔线"><video class="real" playsinline preload="metadata" poster="posters/sample-437-real.jpg" src="videos/sample-437-real.mp4"></video><div class="generated"><video class="gen" muted playsinline preload="metadata" poster="posters/sample-437.jpg" src="videos/sample-437.mp4"></video></div><div class="labels"><span>原视频</span><span>生成视频</span></div><div class="divider"></div><div class="handle"></div><div class="split-hit"></div><div class="controls"><button class="play" type="button" aria-label="播放">▶</button><input class="seek" type="range" min="0" max="1000" value="0" aria-label="播放进度"></div></div></article>
        <article><div class="comparison" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-label="拖动分隔线"><video class="real" playsinline preload="metadata" poster="posters/sample-433-real.jpg" src="videos/sample-433-real.mp4"></video><div class="generated"><video class="gen" muted playsinline preload="metadata" poster="posters/sample-433.jpg" src="videos/sample-433.mp4"></video></div><div class="labels"><span>原视频</span><span>生成视频</span></div><div class="divider"></div><div class="handle"></div><div class="split-hit"></div><div class="controls"><button class="play" type="button" aria-label="播放">▶</button><input class="seek" type="range" min="0" max="1000" value="0" aria-label="播放进度"></div></div></article>
      </div>
    </section>

    <section class="group high">
      <div class="group-heading">较高值样本</div>
      <div class="grid">
        <article><div class="comparison" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-label="拖动分隔线"><video class="real" playsinline preload="metadata" poster="posters/sample-428-real.jpg" src="videos/sample-428-real.mp4"></video><div class="generated"><video class="gen" muted playsinline preload="metadata" poster="posters/sample-428.jpg" src="videos/sample-428.mp4"></video></div><div class="labels"><span>原视频</span><span>生成视频</span></div><div class="divider"></div><div class="handle"></div><div class="split-hit"></div><div class="controls"><button class="play" type="button" aria-label="播放">▶</button><input class="seek" type="range" min="0" max="1000" value="0" aria-label="播放进度"></div></div></article>
        <article><div class="comparison" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-label="拖动分隔线"><video class="real" playsinline preload="metadata" poster="posters/sample-33-real.jpg" src="videos/sample-33-real.mp4"></video><div class="generated"><video class="gen" muted playsinline preload="metadata" poster="posters/sample-33.jpg" src="videos/sample-33.mp4"></video></div><div class="labels"><span>原视频</span><span>生成视频</span></div><div class="divider"></div><div class="handle"></div><div class="split-hit"></div><div class="controls"><button class="play" type="button" aria-label="播放">▶</button><input class="seek" type="range" min="0" max="1000" value="0" aria-label="播放进度"></div></div></article>
        <article><div class="comparison" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-label="拖动分隔线"><video class="real" playsinline preload="metadata" poster="posters/sample-26-real.jpg" src="videos/sample-26-real.mp4"></video><div class="generated"><video class="gen" muted playsinline preload="metadata" poster="posters/sample-26.jpg" src="videos/sample-26.mp4"></video></div><div class="labels"><span>原视频</span><span>生成视频</span></div><div class="divider"></div><div class="handle"></div><div class="split-hit"></div><div class="controls"><button class="play" type="button" aria-label="播放">▶</button><input class="seek" type="range" min="0" max="1000" value="0" aria-label="播放进度"></div></div></article>
      </div>
    </section>
  </main>
  <script>
    document.querySelectorAll('.comparison').forEach(box=>{
      const real=box.querySelector('.real');
      const gen=box.querySelector('.gen');
      const hit=box.querySelector('.split-hit');
      const play=box.querySelector('.play');
      const seek=box.querySelector('.seek');
      let dragging=false;

      const setSplit=value=>{
        const split=Math.max(0,Math.min(100,value));
        box.style.setProperty('--split',split+'%');
        box.setAttribute('aria-valuenow',String(Math.round(split)));
      };
      const splitFromEvent=event=>{
        const rect=box.getBoundingClientRect();
        setSplit((event.clientX-rect.left)/rect.width*100);
      };
      hit.addEventListener('pointerdown',event=>{
        if(event.button!==undefined && event.button!==0)return;
        dragging=true;
        hit.setPointerCapture?.(event.pointerId);
        splitFromEvent(event);
        event.preventDefault();
      });
      hit.addEventListener('pointermove',event=>{if(dragging)splitFromEvent(event)});
      const stop=event=>{dragging=false; if(event.pointerId!==undefined)hit.releasePointerCapture?.(event.pointerId)};
      hit.addEventListener('pointerup',stop);
      hit.addEventListener('pointercancel',stop);
      box.addEventListener('keydown',event=>{
        const current=parseFloat(getComputedStyle(box).getPropertyValue('--split'))||50;
        if(event.key==='ArrowLeft'){setSplit(current-2);event.preventDefault()}
        if(event.key==='ArrowRight'){setSplit(current+2);event.preventDefault()}
      });

      const updateButton=()=>{play.textContent=real.paused?'▶':'❚❚';play.setAttribute('aria-label',real.paused?'播放':'暂停')};
      const syncTime=()=>{
        if(gen.readyState && Math.abs(gen.currentTime-real.currentTime)>.08)gen.currentTime=real.currentTime;
        if(real.duration)seek.value=String(Math.round(real.currentTime/real.duration*1000));
      };
      play.addEventListener('click',()=>{
        if(real.paused){
          if(gen.readyState)gen.currentTime=real.currentTime;
          const promise=real.play();
          if(promise?.catch)promise.catch(()=>{});
        }else real.pause();
      });
      real.addEventListener('play',()=>{const promise=gen.play();if(promise?.catch)promise.catch(()=>{});updateButton()});
      real.addEventListener('pause',()=>{gen.pause();updateButton()});
      real.addEventListener('seeking',()=>{if(gen.readyState)gen.currentTime=real.currentTime});
      real.addEventListener('timeupdate',syncTime);
      real.addEventListener('loadedmetadata',()=>{seek.value='0';syncTime()});
      real.addEventListener('ended',()=>{gen.pause();updateButton()});
      seek.addEventListener('input',()=>{
        if(!real.duration)return;
        const time=Number(seek.value)/1000*real.duration;
        real.currentTime=time;
        if(gen.readyState)gen.currentTime=time;
      });
      updateButton();
    });
  </script>
</body>
</html>
