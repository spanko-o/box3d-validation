<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video gallery</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f7f7; }
  main { max-width: 1760px; margin: 0 auto; padding: 20px; }
  #gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  video { display: block; width: 100%; height: auto; aspect-ratio: 832 / 480; background: #111; object-fit: contain; }
  @media (max-width: 760px) {
    main { padding: 10px; }
    #gallery { grid-template-columns: 1fr; gap: 12px; }
  }
</style>
<main><section id="gallery" aria-label="视频"></section></main>
<script>
const videos = [
  '01_dense_pedestrian_crosswalk_001.mp4',
  '02_dense_pedestrian_crosswalk_002.mp4',
  '03_ghost_probe_turn_ego_stop_enhanced.mp4',
  '04_ghost_probe_moving_001.mp4',
  '05_ghost_probe_static_001.mp4',
  '06_animal_elephant_crossing_001.mp4',
  '07_animal_dog_crossing_001_enhanced.mp4',
  '08_foreign_object_drop_mattress_close_visible.mp4',
  '09_foreign_object_drop_ladder_bound.mp4'
];
const gallery = document.querySelector('#gallery');
for (const name of videos) {
  const video = document.createElement('video');
  video.src = `current/videos/${name}`;
  video.controls = true;
  video.loop = true;
  video.playsInline = true;
  video.preload = 'metadata';
  video.setAttribute('aria-label', name);
  video.addEventListener('play', () => {
    for (const other of gallery.querySelectorAll('video')) {
      if (other !== video) other.pause();
    }
  });
  gallery.append(video);
}
</script>
</html>
