<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>对象级标注</title>
<style>
@font-face{font-family:CJK;src:url('fonts/NotoSansCJKsc-Regular.otf');font-display:swap}
*{box-sizing:border-box;letter-spacing:0}body{margin:0;background:#fafafa;color:#202929;font:15px/1.65 CJK,system-ui,sans-serif}header,main{max-width:1100px;margin:auto;padding:18px 20px}header{border-bottom:1px solid #d8dddd}h1{font-size:22px;font-weight:500;margin:0 0 12px}nav{display:flex;align-items:center;gap:16px;flex-wrap:wrap}select{font:inherit;color:inherit;border:1px solid #adb8b8;background:white;border-radius:4px;padding:4px 8px;max-width:100%}#count{color:#667373;font-size:13px}main{padding-top:0}article{padding:22px 0;border-bottom:1px solid #d8dddd}article[hidden]{display:none}.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:#637070;margin:0 0 8px}.caption{font-size:18px;margin:12px 0 2px;overflow-wrap:anywhere}video{display:block;width:100%;aspect-ratio:832/480;background:#161919}#empty{padding:24px 0;color:#667373}@media(max-width:650px){header,main{padding-left:12px;padding-right:12px}.caption{font-size:17px}}
</style></head><body><header><h1>对象级标注</h1><nav><label>审核 <select id="status"><option value="accept">通过</option><option value="all">全部候选</option><option value="reject">未通过</option><option value="uncertain">待定</option></select></label><span id="count"></span></nav></header><main><div id="gallery"></div><p id="empty" hidden>暂无标注</p></main><script>
const rows=[{"id": "A001-O003", "clip": "A001", "track": "O003", "caption": "一辆白色轿车从右侧路口驶出，向左转弯进入主路。", "status": "accept", "video": "videos/A001-O003.mp4", "poster": "posters/A001-O003.jpg"}, {"id": "A004-O005", "clip": "A004", "track": "O005", "caption": "一辆白色厢式货车从画面右侧驶入路口并向左转弯。", "status": "accept", "video": "videos/A004-O005.mp4", "poster": "posters/A004-O005.jpg"}, {"id": "A005-O002", "clip": "A005", "track": "O002", "caption": "一名穿黄黑条纹上衣的男子手提多个购物袋横穿路口。", "status": "uncertain", "video": "videos/A005-O002.mp4", "poster": "posters/A005-O002.jpg"}, {"id": "A005-O001", "clip": "A005", "track": "O001", "caption": "一名赤裸上身、穿花色短裤和帽子的男子骑着自行车从路口右侧向左侧横穿。", "status": "uncertain", "video": "videos/A005-O001.mp4", "poster": "posters/A005-O001.jpg"}, {"id": "A006-O005", "clip": "A006", "track": "O005", "caption": "一名身穿深色衣裤的行人从画面右侧的人行道区域横穿马路。", "status": "uncertain", "video": "videos/A006-O005.mp4", "poster": "posters/A006-O005.jpg"}, {"id": "A008-O001", "clip": "A008", "track": "O001", "caption": "一辆白色厢式货车从画面右侧驶入路口，向左转弯横穿自车前方。", "status": "uncertain", "video": "videos/A008-O001.mp4", "poster": "posters/A008-O001.jpg"}, {"id": "A008-O002", "clip": "A008", "track": "O002", "caption": "一名身穿黑色短袖上衣和卡其色长裤的行人，手持白色物品，从画面左侧横穿马路向右侧行走。", "status": "uncertain", "video": "videos/A008-O002.mp4", "poster": "posters/A008-O002.jpg"}, {"id": "A010-O002", "clip": "A010", "track": "O002", "caption": "一辆白色厢式货车从左侧路口驶入主路并向右转弯。", "status": "accept", "video": "videos/A010-O002.mp4", "poster": "posters/A010-O002.jpg"}, {"id": "A011-O017", "clip": "A011", "track": "O017", "caption": "一辆白色SUV从画面右侧横穿路口驶向左侧。", "status": "accept", "video": "videos/A011-O017.mp4", "poster": "posters/A011-O017.jpg"}, {"id": "A011-O002", "clip": "A011", "track": "O002", "caption": "一辆银色轿车从画面右侧驶入路口，横穿马路向左侧行驶。", "status": "uncertain", "video": "videos/A011-O002.mp4", "poster": "posters/A011-O002.jpg"}, {"id": "A012-O001", "clip": "A012", "track": "O001", "caption": "一辆黑色轿车在路口执行左转机动。", "status": "accept", "video": "videos/A012-O001.mp4", "poster": "posters/A012-O001.jpg"}, {"id": "A013-O029", "clip": "A013", "track": "O029", "caption": "一名行人从画面左侧向右侧横穿马路。", "status": "accept", "video": "videos/A013-O029.mp4", "poster": "posters/A013-O029.jpg"}, {"id": "A016-O004", "clip": "A016", "track": "O004", "caption": "一名穿浅色上衣和深色短裤的行人从道路右侧向路边移动。", "status": "accept", "video": "videos/A016-O004.mp4", "poster": "posters/A016-O004.jpg"}, {"id": "A018-O003", "clip": "A018", "track": "O003", "caption": "一名身穿浅色上衣和深色长裤的人站在白色轿车右侧，身体前倾并持续探身进入车内进行操作。", "status": "uncertain", "video": "videos/A018-O003.mp4", "poster": "posters/A018-O003.jpg"}, {"id": "A019-O001", "clip": "A019", "track": "O001", "caption": "一名戴黑色棒球帽、穿白色T恤和卡其色短裤的男子从画面右侧向左侧横穿马路。", "status": "uncertain", "video": "videos/A019-O001.mp4", "poster": "posters/A019-O001.jpg"}, {"id": "A021-O001", "clip": "A021", "track": "O001", "caption": "一名穿黑色短袖T恤和黑色短裤的男子从画面左侧进入人行横道，横穿马路走向右侧。", "status": "uncertain", "video": "videos/A021-O001.mp4", "poster": "posters/A021-O001.jpg"}, {"id": "A022-O001", "clip": "A022", "track": "O001", "caption": "一辆橙色三轮摩托车在路口左侧车道等待，随后跟随车流向前行驶。", "status": "uncertain", "video": "videos/A022-O001.mp4", "poster": "posters/A022-O001.jpg"}, {"id": "A024-O005", "clip": "A024", "track": "O005", "caption": "一辆白色SUV在路口执行左转机动。", "status": "accept", "video": "videos/A024-O005.mp4", "poster": "posters/A024-O005.jpg"}, {"id": "A026-O002", "clip": "A026", "track": "O002", "caption": "一辆深灰色SUV从右侧车道向左变道，穿过自车前方。", "status": "accept", "video": "videos/A026-O002.mp4", "poster": "posters/A026-O002.jpg"}];
const labels={accept:'模型审核通过',reject:'未通过',uncertain:'待定'};
const gallery=document.querySelector('#gallery');
for(const r of rows){
  const article=document.createElement('article');article.id=r.id;article.dataset.status=r.status;
  const meta=document.createElement('div');meta.className='meta';
  const name=document.createElement('span');name.textContent=r.clip+' · '+r.track;
  const status=document.createElement('span');status.textContent=labels[r.status];meta.append(name,status);
  const video=document.createElement('video');video.controls=true;video.playsInline=true;video.preload='none';video.src=r.video;video.poster=r.poster;video.setAttribute('aria-label',r.id);
  video.addEventListener('play',()=>{for(const other of gallery.querySelectorAll('video'))if(other!==video)other.pause()});
  const caption=document.createElement('p');caption.className='caption';caption.textContent=r.caption;
  article.append(meta,video,caption);gallery.append(article);
}
const filter=document.querySelector('#status');
function update(){let count=0;for(const a of gallery.children){a.hidden=filter.value!=='all'&&a.dataset.status!==filter.value;if(a.hidden)a.querySelector('video').pause();else count++}document.querySelector('#count').textContent=count+' 条标注';document.querySelector('#empty').hidden=count>0}
filter.addEventListener('change',update);update();
</script></body></html>
