<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Box3D · 13000 步快速验证</title>
<style>
:root{color-scheme:light;--ink:#192124;--muted:#596367;--line:#d8dfe0;--accent:#096e61}
*{box-sizing:border-box;letter-spacing:0}body{margin:0;background:#f5f7f7;color:var(--ink);font:15px/1.6 system-ui,-apple-system,sans-serif}
main{max-width:1440px;margin:auto;padding:32px 28px 64px}header{padding-bottom:24px;border-bottom:1px solid var(--line)}
.eyebrow{color:var(--accent);font-size:12px;font-weight:700}h1{font-size:30px;line-height:1.25;margin:10px 0 16px}p{margin:8px 0}.muted{color:var(--muted)}
.metrics{display:flex;gap:32px;flex-wrap:wrap;margin:20px 0}.metrics strong{display:block;font-size:22px}.metrics span{font-size:13px;color:var(--muted)}
.toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:20px 0}label{display:flex;align-items:center;gap:8px}select{padding:8px;background:white;border:1px solid var(--line);border-radius:4px;color:var(--ink);font:inherit;max-width:100%}
.legend{margin-left:auto;font-size:13px;color:var(--muted)}article{margin:0 0 28px;padding:0 0 24px;border-bottom:1px solid var(--line)}
.title{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 10px}h2{font-size:17px;margin:0}.title a{font-size:13px;color:var(--accent)}
video{display:block;width:100%;height:auto;aspect-ratio:1248/268;background:#111;object-fit:contain;border-radius:4px}footer{color:var(--muted);font-size:13px}a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #dc9c36;outline-offset:3px}
@media(min-width:1100px){#gallery{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}}
@media(max-width:600px){main{padding:22px 14px 40px}h1{font-size:25px}.metrics{gap:20px}.legend{margin-left:0;width:100%}.title{gap:8px}}
</style>
<main>
<header><div class="eyebrow">BOX3D / VALIDATION</div><h1>Box3D · 13000 步快速验证</h1>
<div class="metrics"><div><strong>240p</strong><span>单视图 416 × 240</span></div><div><strong>25 帧</strong><span>每条视频</span></div><div><strong>13000 步</strong><span>累计训练</span></div><div><strong>10 条</strong><span>验证样本</span></div></div>
<p>原模型训练 12000 步 + 显式方向分支适配 1000 步。</p>
<p class="muted">快速验证结果。车辆朝向、车型还原及额外车辆等问题仍在评估中。</p></header>
<div class="toolbar"><label>样本 <select id="sample"><option value="all">全部样本</option></select></label><label><input type="checkbox" id="boxes" checked>3D框</label><label><input type="checkbox" id="loop" checked>循环播放</label><span class="legend">左：GT · 中：Clean HDMap · 右：Prediction<br>红：车头面 · 青：车尾面 · 黄箭头：车头方向</span></div>
<section id="gallery" aria-label="验证视频"></section>
<footer>Checkpoint：heading step-1000 · 累计训练 13000 步 · 三列拼接尺寸不代表单视图训练分辨率。</footer>
</main>
<script>

const gallery=document.querySelector('#gallery'),select=document.querySelector('#sample');
for(const item of records){
 const option=document.createElement('option');option.value=item.id;option.textContent=item.title;select.append(option);
 const article=document.createElement('article');article.dataset.id=item.id;
 const title=document.createElement('div');title.className='title';
 const heading=document.createElement('h2');heading.textContent=item.title;
 const link=document.createElement('a');link.href=item.boxes_video||item.video;link.download='';link.textContent='下载视频';title.append(heading,link);
 const video=document.createElement('video');video.src=item.boxes_video||item.video;video.poster=item.boxes_poster||item.poster;video.controls=true;video.loop=true;video.playsInline=true;video.preload='none';video.setAttribute('aria-label',item.title+'：真实视频、地图与生成结果');video.style.aspectRatio=(item.boxes_width||item.width)+'/'+(item.boxes_height||item.height);
 video.addEventListener('play',()=>{for(const other of gallery.querySelectorAll('video'))if(other!==video)other.pause()});
 article.append(title,video);gallery.append(article);
}
select.addEventListener('change',()=>{for(const article of gallery.children){article.hidden=select.value!=='all'&&article.dataset.id!==select.value;if(article.hidden)article.querySelector('video').pause()}});
document.querySelector('#loop').addEventListener('change',event=>{for(const video of gallery.querySelectorAll('video'))video.loop=event.target.checked});
document.querySelector('#boxes').addEventListener('change',event=>{
 for(const article of gallery.children){
  const item=records.find(record=>String(record.id)===article.dataset.id),video=article.querySelector('video');
  const enabled=event.target.checked&&item.boxes_video,time=video.currentTime,playing=!video.paused;
  video.pause();video.src=enabled?item.boxes_video:item.video;video.poster=enabled?item.boxes_poster:item.poster;
  video.style.aspectRatio=enabled?item.boxes_width+'/'+item.boxes_height:item.width+'/'+item.height;
  article.querySelector('a').href=video.src;
  video.onloadedmetadata=()=>{video.currentTime=Math.min(time,video.duration||0);if(playing)video.play().catch(()=>{});};
 }
});
</script>
